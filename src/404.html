<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · CloudSlang</title>
  <style>
    :root {
      --bg: #0D1117; --surface: #161B22; --border: #30363D;
      --green: #78C13A; --green-dim: #65A818;
      --text: #E6EDF3; --muted: #8B949E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .code {
      font-size: 6rem; font-weight: 800; letter-spacing: -.04em;
      line-height: 1; color: var(--green);
      text-shadow: 0 0 40px rgba(101,168,24,.35);
    }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; color: var(--text); }
    p  { color: var(--muted); max-width: 340px; line-height: 1.6; margin: 0 auto 2rem; }
    a  {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .625rem 1.25rem; border-radius: 8px;
      background: var(--green-dim); color: #fff;
      font-weight: 500; text-decoration: none;
      transition: background 220ms ease;
    }
    a:hover { background: var(--green); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved.</p>
  <a href="/">← Back to CloudSlang</a>
</body>
</html>
